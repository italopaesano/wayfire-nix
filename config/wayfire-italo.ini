# CONFIGURAZIONE PERSONALE DI ITALO
#
# Questo file e' TUO: modificalo liberamente, non lo tocca nessun automatismo
# e non partecipa a nessuna verifica. Gli altri due file di configurazione
# hanno invece vincoli:
#
#   config/wayfire-test.ini  serve ai test nested e deve restare quasi
#                            identico al wayfire.ini di upstream: non
#                            personalizzarlo.
#   config/wayfire-vm.ini    e' la configurazione di lavoro della VM, pensata
#                            per diagnosticare, non per i gusti personali.
#
# Per usare questo file nella VM, scrivi il suo nome dentro
# config/vm-config-attiva (una riga sola) e riavvia la VM. Non serve
# ricostruire nulla: la cartella config/ e' condivisa con la VM.
#
# ─── LE COSE CHE SI CAMBIANO PIU' SPESSO ──────────────────────────────────
#
#  colore dello sfondo ....... sezione [autostart], riga "sfondo"
#  terminale ................. sezione [command], command_terminal
#  numero di workspace ....... sezione [core], vwidth e vheight
#  altezza barra del titolo .. aggiungi [decoration] title_height = 30
#  animazioni ................ aggiungi [animate] e regola le durate
#
# Elenco completo delle opzioni:
# https://github.com/WayfireWM/wayfire/wiki/Configuration
#
# Default config for Wayfire
#
# Copy this to ~/.config/wayfire.ini and edit it to your liking.
#
# Take the tutorial to get started.
# https://github.com/WayfireWM/wayfire/wiki/Tutorial
#
# Read the Configuration document for a complete reference.
# https://github.com/WayfireWM/wayfire/wiki/Configuration

# Input configuration ──────────────────────────────────────────────────────────

# Example configuration:
#
# [input]
# xkb_file = /path/to/keymap.xkb
# xkb_layout = us,fr
# xkb_variant = dvorak,bepo
# xkb_options = grp:win_space_toggle
#
# See Input options for a complete reference.
# https://github.com/WayfireWM/wayfire/wiki/Configuration#input

# Output configuration ─────────────────────────────────────────────────────────

# Example configuration:
#
# [output:eDP-1]
# mode = 1920x1080@60000
# position = 0,0
# transform = normal
# scale = 1.000000
#
# You can get the names of your outputs with wlr-randr.
# https://github.com/emersion/wlr-randr
#
# See also kanshi for configuring your outputs automatically.
# https://wayland.emersion.fr/kanshi/
#
# See Output options for a complete reference.
# https://github.com/WayfireWM/wayfire/wiki/Configuration#output

# Core options ─────────────────────────────────────────────────────────────────

[core]

# List of plugins to be enabled.
# See the Configuration document for a complete list.
plugins = \
  alpha \
  animate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  ext-workspace \
  fast-switcher \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  invert \
  ipc \
  ipc-rules \
  move \
  oswitch \
  place \
  resize \
  scale \
  scale-title-filter \
  session-lock \
  shortcuts-inhibit \
  simple-tile \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

# Note: [blur] is not enabled by default, because it can be resource-intensive.
# Feel free to add it to the list if you want it.
# You can find its documentation here:
# https://github.com/WayfireWM/wayfire/wiki/Configuration#blur

# Close focused window.
close_top_view = <super> KEY_Q | <alt> KEY_F4

# Quattro workspace in FILA, non in griglia.
#
# Il plugin cube mostra la RIGA corrente di workspace come facce di un cubo:
# con vheight = 1 e vwidth = 4 si ottiene un cubo a quattro facce, che e'
# la forma naturale. Con una griglia 3x3 le facce sarebbero state 3 e le
# altre due righe irraggiungibili dal cubo.
vwidth = 4
vheight = 1

# Prefer client-side decoration or server-side decoration
#
# "server" invece di "client": cosi' e' Wayfire a disegnare TUTTE le barre
# del titolo, uguali per ogni finestra, con i propri pulsanti e i propri
# gestori (plugins/decor/deco-layout.cpp:303-325). Con "client" ogni
# applicazione si disegna la cornice a modo suo e i pulsanti si comportano
# in modo incoerente. Qui vogliamo provare il codice di Wayfire.
preferred_decoration_mode = server

# Mouse bindings ───────────────────────────────────────────────────────────────

# Drag windows by holding down Super and left mouse button.
[move]
activate = <super> BTN_LEFT

# Resize them with right mouse button + Super.
[resize]
activate = <super> BTN_RIGHT

# Zoom in the desktop by scrolling + Super.
[zoom]
modifier = <super>

# Change opacity by scrolling with Super + Alt.
[alpha]
modifier = <super> <alt>

# Rotate windows with the mouse.
[wrot]
activate = <super> <ctrl> BTN_RIGHT

# Startup commands ─────────────────────────────────────────────────────────────

[autostart]
# Siamo dentro una VM isolata, quindi questi comandi non possono toccare la
# sessione dell'host: a differenza del test nested, qui l'autostart e' sicuro.
#
# wf-shell non e' pacchettizzato in nixpkgs, quindi si usano swaybg e waybar:
# parlano layer-shell, un protocollo standard, e funzionano con qualunque
# compositore wlroots a prescindere dalla versione di Wayfire. Nessun
# rischio di incompatibilita' con il nostro 0.12.
autostart_wf_shell = false
# Un colore diverso da quello della configurazione di lavoro, cosi' si
# capisce a colpo d'occhio quale delle due e' in uso.
sfondo = swaybg -c 2d4a3e
# -c/-s puntano alla cartella condivisa: si possono ritoccare dall'host e
# rivedere l'effetto riavviando solo waybar, senza ricostruire la VM.
pannello = waybar -c /mnt/config/waybar-italo.json -s /mnt/config/waybar-italo.css

# Le due barre di wf-shell, in prova accanto a quelle di waybar.
# Per toglierle basta commentare queste due righe.
wfpanel = wf-panel
wfdock = wf-dock

# Mostra scrivania ──────────────────────────────────────────────────────────
#
# toggle_showdesktop e' un INTERRUTTORE: la prima volta nasconde tutte le
# finestre, la seconda le ripristina dov'erano. Il pulsante all'estrema
# sinistra della barra dei lanciatori richiama questa stessa scorciatoia
# simulandola con wtype, perche' waybar non puo' invocare direttamente le
# azioni di Wayfire (l'interfaccia IPC espone solo operazioni sulle finestre,
# non l'attivazione di scorciatoie).
[wm-actions]
toggle_showdesktop = <super> KEY_D

# Affiancamento automatico, in modalita' IBRIDA ─────────────────────────────
#
# Le finestre nascono flottanti come sempre; Super+T affianca quella attiva,
# e da quel momento si dispone da sola insieme alle altre affiancate.
# Premendolo di nuovo torna flottante.
#
# Il trucco per la modalita' ibrida sta in tile_by_default: e' un'espressione
# di confronto, e quella qui sotto non corrisponde mai a nessuna finestra
# (nessun programma si chiama cosi'). Il valore predefinito sarebbe "all",
# che affiancherebbe tutto automaticamente. I campi utilizzabili sono
# app_id, title e type (src/core/view-access-interface.cpp:39-101).
[simple-tile]
tile_by_default = app_id is "__nessuna-finestra__"
key_toggle = <super> KEY_T

# Spostarsi fra le finestre affiancate senza mouse, alla maniera di vim.
key_focus_left = <super> KEY_H
key_focus_right = <super> KEY_L
key_focus_above = <super> KEY_K
key_focus_below = <super> KEY_J

# Spazio fra le finestre affiancate: 5 px e' discreto, alza se lo vuoi piu' ariosa.
inner_gap_size = 5

# Tutte le finestre a colpo d'occhio ────────────────────────────────────────
#
# Rimpicciolisce le finestre e le dispone sullo schermo (come Expose' su
# macOS). Mentre e' aperto puoi DIGITARE per filtrarle per titolo: e' il
# plugin scale-title-filter, utile quando hai molti terminali simili.
[scale]
toggle = <super> KEY_P                   # finestre del workspace corrente
toggle_all = <super> <shift> KEY_P       # finestre di TUTTI i workspace

# Include anche le finestre ridotte a icona, cosi' scale diventa anche un
# modo per riprenderle senza passare dal pannello.
include_minimized = true

# Chiude una finestra col tasto centrale del mouse mentre scale e' aperto.
middle_click_close = true

[scale-title-filter]
# Mostra a schermo quello che stai digitando per filtrare.
overlay = true
case_sensitive = false

# NOTA su wf-shell: le sue impostazioni NON vanno qui.
# wf-panel e wf-dock leggono un file separato, ~/.config/wf-shell.ini
# (src/util/wf-shell-app.cpp:33), non wayfire.ini. Metterle qui non ha
# effetto e in piu' fa produrre a Wayfire un warning per ogni opzione
# che non riconosce. La configurazione sta in config/wf-shell-italo.ini.

[command]

# Start a terminal
# https://github.com/alacritty/alacritty
binding_terminal = <super> KEY_ENTER
command_terminal = foot

# Start your launcher
# https://hg.sr.ht/~scoopta/wofi
# Note: Add mode=run or mode=drun to ~/.config/wofi/config.
# You can also specify the mode with --show option.
binding_launcher = <super> <shift> KEY_ENTER
command_launcher = wofi

# Screen locker
# https://github.com/swaywm/swaylock
binding_lock = <super> <shift> KEY_ESC
command_lock = swaylock

# Logout
# https://github.com/ArtsyMacaw/wlogout
binding_logout = <super> KEY_ESC
command_logout = wlogout

# Screenshots
# https://wayland.emersion.fr/grim/
# https://wayland.emersion.fr/slurp/
binding_screenshot = KEY_PRINT
command_screenshot = grim $(date '+%F_%T').webp
binding_screenshot_interactive = <shift> KEY_PRINT
command_screenshot_interactive = slurp | grim -g - $(date '+%F_%T').webp

# Volume controls
# https://alsa-project.org
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = amixer set Master 5%+
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = amixer set Master 5%-
binding_mute = KEY_MUTE
command_mute = amixer set Master toggle

# Screen brightness
# https://haikarainen.github.io/light/
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = light -A 5
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = light -U 5

# Windows ──────────────────────────────────────────────────────────────────────

# Actions related to window management functionalities.
#
# Example configuration:
#
# [wm-actions]
# toggle_fullscreen = <super> KEY_F
# toggle_always_on_top = <super> KEY_X
# toggle_always_on_bottom = <super> <alt> KEY_X
# toggle_sticky = <super> <shift> KEY_X

# Position the windows in certain regions of the output.
[grid]
#
# ⇱ ↑ ⇲   │ 7 8 9
# ← f →   │ 4 5 6
# ⇱ ↓ ⇲ d │ 1 2 3 0
# ‾   ‾
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9
# Restore default.
restore = <super> KEY_DOWN | <super> KEY_KP0

# Change active window with an animation.
[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

# Simple active window switcher.
[fast-switcher]
activate = <alt> KEY_ESC

# Workspaces ───────────────────────────────────────────────────────────────────

# Switch to workspace.
[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
# Su/giu' disattivate: con vheight = 1 non c'e' nulla sopra o sotto.
#binding_down = <ctrl> <super> KEY_DOWN
#binding_up = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT
# Move the focused window with the same key-bindings, but add Shift.
with_win_left = <ctrl> <super> <shift> KEY_LEFT
#with_win_down = <ctrl> <super> <shift> KEY_DOWN
#with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT

# Il cubo: mostra i quattro workspace come facce di un cubo rotante.
[cube]
# Tieni premuto e trascina col mouse per farlo girare.
activate = <ctrl> <alt> BTN_LEFT

# Rotazione da tastiera, una faccia alla volta. Erano disattivate
# ("none" di default): queste le attivano.
#
# Si usa <ctrl><alt> e non <ctrl><super>, che e' gia' impegnato da vswitch
# per il normale cambio di workspace. Cosi' le due cose restano distinte:
#   <ctrl><super> frecce  cambia workspace con lo scorrimento
#   <ctrl><alt>   frecce  gira il cubo
# ed e' anche coerente con <ctrl><alt>+clic che apre il cubo col mouse.
rotate_left = <ctrl> <alt> KEY_LEFT
rotate_right = <ctrl> <alt> KEY_RIGHT

# Aspetto. deform piega le facce verso l'interno (0 = cubo netto,
# 1 = cilindro, 2 = sfera); zoom e' quanto si allontana la vista.
deform = 0
light = true
zoom = 0.1

# Velocita' della rotazione col mouse: alzala se ti sembra lento.
speed_spin_horiz = 0.02

# Sfondo dietro il cubo.
background = \#0d1b2aFF

# Show an overview of all workspaces.
[expo]
toggle = <super> KEY_E
# Select a workspace.
# Workspaces are arranged into a grid of 3 × 3.
# The numbering is left to right, line by line.
#
# ⇱ k ⇲
# h ⏎ l
# ⇱ j ⇲
# ‾   ‾
# See core.vwidth and core.vheight for configuring the grid.
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
# Con 4 workspace, i selettori oltre il quarto sono inutili.
#select_workspace_5 = KEY_5
#select_workspace_6 = KEY_6
#select_workspace_7 = KEY_7
#select_workspace_8 = KEY_8
#select_workspace_9 = KEY_9

# Outputs ──────────────────────────────────────────────────────────────────────

# Change focused output.
[oswitch]
# Switch to the next output.
next_output = <super> KEY_O
# Same with the window.
next_output_with_win = <super> <shift> KEY_O

# Invert the colors of the whole output.
[invert]
toggle = <super> KEY_I

# Send toggle menu event.
[wayfire-shell]
toggle_menu = <super>

# Rules ────────────────────────────────────────────────────────────────────────

# Example configuration:
#
# [window-rules]
# maximize_alacritty = on created if app_id is "Alacritty" then maximize
#
# You can get the properties of your applications with the following command:
# $ WAYLAND_DEBUG=1 alacritty 2>&1 | kak
#
# See Window rules for a complete reference.
# https://github.com/WayfireWM/wayfire/wiki/Configuration#window-rules

# Output della VM di test ──────────────────────────────────────────────────────

# Serve SOLO nella VM (vm/configuration.nix); nel test nested non esiste alcun
# output con questo nome e la sezione viene semplicemente ignorata.
#
# Perché è necessaria: virtio-gpu espone un EDID vuoto, quindi il connettore
# offre una lista generica di modi in cui il "preferito" è 640x480, e wlroots
# parte lì. Il parametro kernel video= corregge il framebuffer ma non la
# scelta di wlroots, che legge i modi del connettore.
[output:Virtual-1]
mode = 1280x800


# ─── SPAZIO PER LE TUE AGGIUNTE ───────────────────────────────────────────
#
# Alcune sezioni che potresti volere, lasciate commentate. Togli il cancelletto
# per attivarle.

# Aspetto delle decorazioni disegnate da Wayfire.
# [decoration]
# title_height = 30
# border_size = 4
# active_color = \#4a7ab5FF
# inactive_color = \#2a3f5aFF

# Velocita' delle animazioni (in millisecondi). Abbassale se le trovi lente.
# [animate]
# duration = 300
# open_animation = zoom
# close_animation = zoom

# Effetto sfocatura dietro le finestre: bello ma pesante, soprattutto senza
# accelerazione grafica. Ricorda di aggiungere "blur" alla lista plugins.
# [blur]
# method = kawase

# Affiancamento automatico delle finestre.
# Ricorda di aggiungere "simple-tile" alla lista plugins.
# [simple-tile]
# key_toggle = <super> KEY_T
