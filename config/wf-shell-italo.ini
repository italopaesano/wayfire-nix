# Configurazione di wf-shell (wf-panel, wf-dock, wf-background).
#
# File SEPARATO da wayfire.ini: wf-shell cerca ~/.config/wf-shell.ini
# (src/util/wf-shell-app.cpp:33). Lo script di sessione della VM crea un
# collegamento da li' a questo file, che sta nella cartella condivisa e
# quindi si modifica dall'host.
#
# Queste due barre affiancano quelle di waybar per poterle confrontare.
# Differenza strutturale: wf-panel gestisce UNA barra per schermo, non un
# elenco come waybar. Per averne due si affianca wf-dock, programma a se'
# stante che mostra le finestre come icone.

[panel]
position = bottom

# Widget disponibili: menu launchers window-list workspace-switcher clock
# network battery volume mixer brightness tray notifications
# command-output language weather separator spacing<N>
widgets_left = menu spacing4 launchers
widgets_center = none
widgets_right = workspace-switcher spacing8 clock

minimal_height = 34
launchers_size = 24
launchers_spacing = 6
clock_format = %H:%M
menu_fuzzy_search = true

# I lanciatori: prefisso launcher_ col nome del file .desktop,
# oppure launcher_cmd_ per un comando diretto.
launcher_terminale = foot.desktop
launcher_file = pcmanfm.desktop
launcher_editor = org.xfce.mousepad.desktop
launcher_calcolatrice = galculator.desktop

# Il dock fa da barra delle finestre, l'equivalente dell'elenco di waybar.
[dock]
position = bottom
autohide = false
full_span = true
minimal_height = 44
icon_height = 28
